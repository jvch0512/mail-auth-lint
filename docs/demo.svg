<svg xmlns="http://www.w3.org/2000/svg" width="860" height="462" viewBox="0 0 860 462" role="img" aria-label="Terminal replay of mail-auth-lint on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}</style><rect width="860" height="462" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">mail-auth-lint</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./mail-auth-lint examples/zone.txt</text><text class="r d0 " x="20" y="108" xml:space="preserve">bulk.example.test: grade B, score 75/100, 3 findings</text><text class="r d1 " x="20" y="130" xml:space="preserve">  HIGH     MA004  SPF needs 11 DNS lookups before nested includes: the limit is 10, over it SPF fails pe</text><text class="r d2 " x="20" y="152" xml:space="preserve">  MEDIUM   MA003  SPF ends with ~all (softfail): move to -all once the sources are known</text><text class="r d3 " x="20" y="174" xml:space="preserve">  MEDIUM   MA006  DMARC applies to only 25% of mail (pct=)</text><text class="r d4 " x="20" y="196" xml:space="preserve">legacy.example.test: grade F, score 20/100, 6 findings</text><text class="r d5 " x="20" y="218" xml:space="preserve">  CRITICAL MA002  more than one SPF record: this is a permanent error and SPF stops working</text><text class="r d6 " x="20" y="240" xml:space="preserve">  CRITICAL MA007  weak: DKIM key looks like 512-bit RSA and can be factored</text><text class="r d7 " x="20" y="262" xml:space="preserve">  MEDIUM   MA006  DMARC policy is p=none: monitoring only, spoofed mail is still delivered</text><text class="r d8 " x="20" y="284" xml:space="preserve">  MEDIUM   MA006  DMARC has no rua= address: you will never see who is sending as you</text><text class="r d9 " x="20" y="306" xml:space="preserve">  MEDIUM   MA007  old: DKIM key looks like 1024-bit RSA: rotate to 2048-bit</text><text class="r d10 " x="20" y="328" xml:space="preserve">  MEDIUM   MA007  old: DKIM is in testing mode (t=y): receivers ignore failures</text><text class="r d11 " x="20" y="350" xml:space="preserve">parked.example.test: grade C, score 70/100, 2 findings</text><text class="r d12 " x="20" y="372" xml:space="preserve">  HIGH     MA001  no SPF record: anyone can spoof this domain and receivers have nothing to check</text><text class="r d13 " x="20" y="394" xml:space="preserve">  HIGH     MA005  no DMARC record: receivers cannot be told to reject spoofed mail</text><text class="r d14 " x="20" y="416" xml:space="preserve">shop.example.test: grade A, score 100/100, 0 findings</text></svg>
